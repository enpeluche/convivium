<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte de l'équité</title>
<meta name="description" content="Carte interactive des notions d'équité pour le partage de biens indivisibles : définitions, implications, preuves, contre-exemples et algorithmes.">
<meta name="author" content="Lucas Noirot">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ============ En-tête (direction artistique d'enpeluche.github.io) ============ -->
<header class="entete">
  <a class="brand" href="#biens">
    <img src="assets/logo.png" alt="" width="34" height="34">
    <span><b data-i18n="siteTitre">Carte de l'équité</b><small data-i18n="siteSous"></small></span>
  </a>
  <!-- Le moteur lit data-carte pour savoir quel onglet est affiché (aria-current) -->
  <nav class="onglets" aria-label="Cartes">
    <a href="#biens" data-carte="biens" data-i18n="ongletBiens">Équité</a>
    <a href="#corvees" data-carte="corvees" data-i18n="ongletCorvees">Corvées</a>
    <a href="#ponderee" data-carte="ponderee" data-i18n="ongletPonderee">Pondérée</a>
    <a href="#valuations" data-carte="valuations" data-i18n="ongletValuations">Valuations</a>
    <a href="#algorithmes" data-carte="algorithmes" data-i18n="ongletAlgos">Algorithmes</a>
    <a href="#definitions" data-carte="definitions" data-i18n="ongletDefs">Définitions</a>
  </nav>
  <div class="top-right">
    <a class="iconlink" href="https://enpeluche.github.io" target="_blank" rel="noopener" data-i18n-title="siteLien" data-i18n-aria="siteLien"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.93 6h-2.95a15.6 15.6 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.93 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14a8.2 8.2 0 0 1 0-4h3.38a16.5 16.5 0 0 0 0 4H4.26zm.81 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 0 1 5.07 16zm2.95-8H5.07a7.99 7.99 0 0 1 4.33-3.56A15.6 15.6 0 0 0 8.02 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66a14.7 14.7 0 0 1 0-4h4.68a14.7 14.7 0 0 1 0 4zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14a16.5 16.5 0 0 0 0-4h3.38a8.2 8.2 0 0 1 0 4h-3.38z"/></svg></a>
    <a class="iconlink" href="https://github.com/enpeluche" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg></a>
    <a class="iconlink" href="https://linkedin.com/in/enpeluche" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></a>
    <span class="langtoggle" role="group" data-i18n-aria="langue">
      <button type="button" data-lang="fr" lang="fr">FR</button><button type="button" data-lang="en" lang="en">EN</button><i aria-hidden="true"></i>
    </span>
  </div>
</header>

<!-- ============ Vue « carte » : graphe à gauche, carte à droite ============ -->
<main class="page" id="vue-carte">
  <div class="wrap">
    <div class="titre-carte"><h1><span id="titre"></span> <small id="sous-titre"></small></h1>
      <a class="lien-notations" id="lien-notations" href="#definitions" data-i18n="notations"></a></div>

    <!-- Le JS lit data-fam pour surligner une famille au survol ; les noms viennent des données -->
    <div class="legend" data-i18n-aria="legende">
      <div id="selecteur" hidden></div>
      <span class="fam" data-fam="envie" tabindex="0" style="color:var(--envie)"><span class="sw"></span><b></b></span>
      <span class="fam" data-fam="part"  tabindex="0" style="color:var(--part)"><span class="sw"></span><b></b></span>
      <span class="fam" data-fam="egal"  tabindex="0" style="color:var(--egal)"><span class="sw"></span><b></b></span>
      <span class="fam" data-fam="eff"   tabindex="0" style="color:var(--eff)"><span class="sw"></span><b></b></span>
      <span class="glyphs" id="legende-statuts"></span>
      <span id="legende-indices"></span>
      <span id="legende-jumelles"></span>
    </div>

    <!-- Onglet Algorithmes : barre de choix (à la place de la légende) -->
    <div class="algo-barre" id="algo-barre" hidden>
      <div class="choix-algo" role="group" data-i18n-aria="choixAlgo">
        <button data-algo="tourniquet" data-i18n="btnTourniquet"></button>
        <button data-algo="cycles" data-i18n="btnCycles"></button>
        <button data-algo="sacs" data-i18n="btnSacs"></button>
        <button data-algo="sansmu" data-i18n="btnSansMu"></button>
      </div>
      <select id="algo-instance" data-i18n-aria="instance"></select>
      <span class="dim"><span data-i18n="agents"></span> <button data-dim="n:-1" data-i18n-aria="moinsAgent">−</button><b id="algo-n"></b><button data-dim="n:1" data-i18n-aria="plusAgent">+</button></span>
      <span class="dim"><span data-i18n="biens"></span> <button data-dim="m:-1" data-i18n-aria="moinsBien">−</button><b id="algo-m"></b><button data-dim="m:1" data-i18n-aria="plusBien">+</button></span>
      <button id="algo-hasard" data-i18n="hasard"></button>
      <span class="note-instance" id="algo-note"></span>
    </div>

    <!-- Le SVG est vide : tout est dessiné par le script -->
    <div class="diagram" id="diagram">
      <svg id="map" viewBox="0 0 1040 660" role="group" data-i18n-aria="graphe"></svg>
    </div>

    <!-- Onglet Algorithmes : tableaux, graphe d'envie et pas à pas -->
    <section class="algo-zone" id="algo" hidden></section>

  </div>

  <!-- La carte : un seul élément, dont on remplace le contenu à chaque ouverture -->
  <div id="card" class="card" hidden role="dialog" aria-labelledby="card-sigle"></div>
</main>

<!-- ============ Vue « définitions » ============ -->
<div class="defs-scroll" id="vue-defs" hidden>
<section class="defs-page">
  <aside class="defs-toc">
    <input type="search" id="defs-filtre" data-i18n-ph="defsFiltre" autocomplete="off" spellcheck="false">
    <p class="toc-titre" data-i18n="defsSommaire"></p>
    <nav id="defs-sommaire"></nav>
  </aside>
  <div class="defs-main">
    <header class="defs-entete">
      <h1 data-i18n="defsTitre"></h1>
      <p class="lead" data-i18n="defsIntro"></p>
    </header>
    <div id="defs-contenu"></div>
  </div>
</section>
</div>

<!-- KaTeX embarqué (aucun appel réseau), puis les données, la langue et le moteur -->
<script src="assets/vendor/katex/katex.min.js"></script>
<script src="assets/donnees.js"></script>
<script src="assets/donnees-en.js"></script>
<script src="assets/langue.js"></script>
<script src="assets/definitions.js"></script>
<script src="assets/moteur.js"></script>
<script>
  // Sélecteur de langue
  document.querySelectorAll(".langtoggle button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.lang !== LANG) appliquerLangue(b.dataset.lang);
  }));
</script>
</body>
</html>
